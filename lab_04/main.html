<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Images mini slide</title>
</head>
<body>
    <section class="gallery">
        <div class="big-images">
            <img id="img1" src="images\big_picture_1.jpg" alt="Lacke">
            <img id="img2" src="images\big_picture_2.jpg" alt="Wave">
            <img id="img3" src="images\big_picture_3.jpg" alt="Beach">
            <img id="img4" src="images\big_picture_4.jpg" alt="Park Road">
            <img id="img5" src="images\big_picture_5.jpg" alt="Waterfall">
        </div>

        <div class="small-images">
            <a href="#img1">
                <img src="images\small_picture_1.jpg" alt="Lacke">
            </a>
            <a href="#img2">
                <img src="images\small_picture_2.jpg" alt="Wave">
            </a>
            <a href="#img3">
                <img src="images\small_picture_3.jpg" alt="Beach">
            </a>
            <a href="#img4">
                <img src="images\small_picture_4.jpg" alt="Park Road">
            </a>
            <a href="#img5">
                <img src="images\small_picture_5.jpg" alt="Waterfall">
            </a>
        </div>
    </section>
</body>
</html>
