<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="form-container">
        <form action="#" method="POST">

            <div class="form-body">
                <div class="form-section reg-section">
                    <h3>Registration form</h3>

                    <div class="input-group">
                        <img src="icons/username.png" alt="User Icon" class="input-icon">
                        <input type="text" name="username" placeholder="Username" required>
                    </div>

                    <div class="input-group">
                        <img src="icons/email.png" alt="Email Icon" class="input-icon">
                        <input type="email" name="email" placeholder="Email address" required>
                    </div>

                    <div class="input-group">
                        <img src="icons/pswd.png" alt="Password Icon" class="input-icon">
                        <input type="password" name="password" placeholder="Password" required minlength="8">
                    </div>

                    <div class="input-group">
                        <div class="icon-spacer"></div>
                        <input type="password" name="confirm_password" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="form-section pers-section">
                    <h3>Personal details</h3>

                    <div class="input-group">
                        <input type="text" name="first_name" placeholder="First name" required>
                    </div>

                    <div class="input-group">
                        <input type="text" name="last_name" placeholder="Last name" required>
                    </div>

                    <div class="input-group">
                        <select name="gender" required>
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <input type="text" name="birth_date" placeholder="mm/dd/yyyy" onfocus="(this.type='date')"
                            onblur="if(!this.value) this.type='text'" required>
                    </div>
                </div>

                <div class="form-section check-section">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="newsletter">
                        <span>I want to receive news and special offers</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="terms" required>
                        <span>I agree with the Terms and Conditions</span>
                    </label>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-btn">SUBMIT</button>
            </div>

        </form>
    </div>

</body>

</html>
